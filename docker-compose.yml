version: '3.8'

services:
  # 1. База данных PostGIS
  db:
    image: postgis/postgis:16-3.4
    container_name: posutochka_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: posutochka
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d posutochka"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis — Брокер для Celery и кэш
  redis:
    image: redis:7-alpine
    container_name: posutochka_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. MinIO — Хранилище фото
  minio:
    image: minio/minio:latest
    container_name: posutochka_storage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: strong_password_2026
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # 4. Основное приложение FastAPI
  app:
    build: .
    container_name: posutochka_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:123456@db:5432/posutochka
      - CELERY_BROKER_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=strong_password_2026
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # 5. Celery Worker — Исполнитель задач
  worker:
    build: .
    container_name: posutochka_worker
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - DATABASE_URL=postgresql+asyncpg://postgres:123456@db:5432/posutochka
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: celery -A app.celery_app.celery_app worker --loglevel=info

  # 6. Celery Beat — Планировщик (для ночной очистки коинов)
  beat:
    build: .
    container_name: posutochka_beat
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: celery -A app.celery_app.celery_app beat --loglevel=info

volumes:
  postgres_data:
  minio_data:
