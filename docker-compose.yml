version: '3.8'

services:
  # 1. База данных PostGIS (с поддержкой гео-запросов и GIST индексов)
  db:
    image: postgis/postgis:16-3.4
    container_name: posutochka_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: posutochka
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d posutochka"]
      interval: 5s
      timeout: 5s
      retries: 5
    stop_grace_period: 3s
    deploy:
      resources:
        limits:
          cpus: '0.5'        # Использовать не более половины одного ядра
          memory: 1G       # Лимит памяти (для frontend можно поставить 1G)
        reservations:
          memory: 128M       # Гарантированный минимум

  # 2. Redis — Брокер для Celery и кэш
  redis:
    image: redis:7-alpine
    container_name: posutochka_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    stop_grace_period: 3s
    deploy:
      resources:
        limits:
          cpus: '0.5'        # Использовать не более половины одного ядра
          memory: 512M       # Лимит памяти (для frontend можно поставить 1G)
        reservations:
          memory: 128M       # Гарантированный минимум

  # 3. MinIO — Хранилище фото (S3-совместимое)
  minio:
    image: minio/minio:latest
    container_name: posutochka_storage
    ports:
      - "9000:9000" # API
      - "9001:9001" # Web Console
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: strong_password_2026
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    stop_grace_period: 3s
    deploy:
      resources:
        limits:
          cpus: '0.5'        # Использовать не более половины одного ядра
          memory: 512M       # Лимит памяти (для frontend можно поставить 1G)
        reservations:
          memory: 128M       # Гарантированный минимум
  minio-init:
    image: minio/mc
    container_name: posutochka_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 admin strong_password_2026) do echo 'Waiting for MinIO...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing myminio/apartments;
      /usr/bin/mc anonymous set download myminio/apartments;
      /usr/bin/mc anonymous set public myminio/apartments;
      exit 0;
      "

  # 4. Основное приложение FastAPI
  app:
    build: .
    container_name: posutochka_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:123456@db:5432/posutochka
      - CELERY_BROKER_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=strong_password_2026
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    stop_grace_period: 3s
    deploy:
        resources:
          limits:
            cpus: '0.5'        # Использовать не более половины одного ядра
            memory: 512M       # Лимит памяти (для frontend можно поставить 1G)
          reservations:
            memory: 128M       # Гарантированный минимум
  # 5. Celery Worker — Исполнитель фоновых задач (уведомления)
  worker:
    build: .
    container_name: posutochka_worker
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - DATABASE_URL=postgresql+asyncpg://postgres:123456@db:5432/posutochka
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: celery -A app.celery_app.celery_app worker --loglevel=info
    stop_grace_period: 3s
    deploy:
      resources:
        limits:
          cpus: '0.5'        # Использовать не более половины одного ядра
          memory: 512M       # Лимит памяти (для frontend можно поставить 1G)
        reservations:
          memory: 128M       # Гарантированный минимум

  # 6. Celery Beat — Планировщик задач
  beat:
    build: .
    container_name: posutochka_beat
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: celery -A app.celery_app.celery_app beat --loglevel=info
    stop_grace_period: 3s
    deploy:
      resources:
        limits:
          cpus: '0.5'        # Использовать не более половины одного ядра
          memory: 512M       # Лимит памяти (для frontend можно поставить 1G)
        reservations:
          memory: 128M       # Гарантированный минимум

  # 7. Фронтенд Next.js (Новый сервис!)
  frontend:
    build:
      context: ./posutochka-front
      dockerfile: Dockerfile
    container_name: posutochka_nextjs
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./posutochka-front:/app
      - /app/node_modules # Сохраняем модули внутри контейнера
    depends_on:
      - app
    stop_grace_period: 3s
    deploy:
      resources:
        limits:
          cpus: '0.5'        # Использовать не более половины одного ядра
          memory: 1G      # Лимит памяти (для frontend можно поставить 1G)
        reservations:
          memory: 128M       # Гарантированный минимум
  # # 8. Туннель для Telegram (Pinggy)
  # pinggy:
  #   image: alpine
  #   container_name: posutochka_pinggy
  #   tty: true
  #   stdin_open: true
  #   command: sh -c "apk add --no-cache openssh-client && ssh -o StrictHostKeyChecking=no -p 443 -R0:app:8000 a.pinggy.io"
  #   depends_on:
  #     - app
  # tunnel:
  #   image: cloudflare/cloudflared:latest
  #   container_name: posutochka_tunnel
  #   restart: always
  #   # command: tunnel --protocol http2 --url http://app:8000
  #    # Убираем протокол http2 и добавляем заголовок хоста для точности
  #   command: tunnel --url http://app:8000 --http-int-sniff-res

volumes:
  postgres_data:
  minio_data:

